[workspace]
resolver = "2"
members = [
  "crates/guild-types",
  "crates/guild-manifest",
  "crates/guild-runner",
  "crates/guild-registry",
  "crates/guild-mcp",
  "crates/guild-sdk-rust",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
