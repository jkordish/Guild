[workspace]
members = [
    "xtask",
    "crates/guild-draft-truth",
    "crates/guild-types",
    "crates/guild-manifest",
    "crates/guild-runner",
    "crates/guild-registry",
    "crates/guild-mcp",
    "crates/guild-sdk-rust",
]
resolver = "2"

[workspace.package]
categories = ["development-tools", "wasm"]
edition = "2024"
keywords = ["guild", "mcp", "wasm", "skills", "runtime"]
license = "UNLICENSED"
readme = "README.md"
repository = "https://github.com/jkordish/Guild"
rust-version = "1.94"
version = "0.1.1"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
anyhow = "1"
ed25519-dalek = "2"
futures-util = "0.3"
getrandom = "0.4.2"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
jsonschema = { version = "0.46.5", default-features = false }
oci-client = "0.16.1"
registry-testkit = "0.1.3"
schemars = { version = "1.2", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"
wasmtime = { version = "44.0.1", features = ["component-model"] }
wasmtime-wasi = "44.0.1"
wasmtime-wasi-http = "44.0.1"
wit-bindgen = "0.57.1"

[workspace.lints.clippy]
# Wasmtime and Cranelift currently pull two incompatible hashbrown major lines.
# That duplication is upstream to this workspace, so keep the rest of
# clippy::cargo strict while exempting this one non-actionable graph lint.
multiple_crate_versions = "allow"
