[workspace]
resolver = "2"
members = [
  "crates/guild-types",
  "crates/guild-manifest",
  "crates/guild-runner",
  "crates/guild-registry",
  "crates/guild-mcp",
  "crates/guild-sdk-rust",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
semver = "1"
sha2 = "0.10"
walkdir = "2"
wasmtime = { version = "42.0.1", features = ["component-model"] }
wasmtime-wasi = "42.0.1"
wit-bindgen = "0.53.1"
