name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # GitHub-hosted runners are hitting disk and linker pressure while compiling the
      # full workspace test graph; CI does not need debug info and can use fewer jobs.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Effect Kernel Boundary
        run: cargo run -q -p xtask -- effect-kernel check-dependencies

      - name: Draft Truth
        run: cargo run -q -p xtask -- draft-v1 truth check

      - name: Project Positioning
        run: cargo run -q -p xtask -- project-positioning check

      - name: Patent Packet
        run: cargo run -q -p xtask -- patent-packet check
